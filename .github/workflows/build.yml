name: bluebuild
on:
  schedule:
    - cron: "00 06 * * *"   # build diario 06:00 UTC (tras los ublue/bazzite upstream)
  push:
    paths-ignore:           # no reconstruir si solo cambia documentacion
      - "**.md"
  pull_request:
  workflow_dispatch:        # permite lanzar builds a mano
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false      # que un fallo no cancele el resto de la matriz
      matrix:
        recipe:
          - recipe.yml
    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true

      - name: Prune old image versions
        if: github.event_name != 'pull_request'   # no limpiar en PRs (token de fork es read-only)
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: bazzite-casa
          keep-n-tagged: 30            # conserva las 30 imagenes etiquetadas mas recientes
          exclude-tags: latest         # nunca borrar :latest (contrato downstream con kxs-ansible)
          delete-untagged: true        # borra untagged huerfanas (los hijos de imagenes vivas estan protegidos)
          delete-orphaned-images: true # borra .sig cuya imagen ya no existe
          token: ${{ github.token }}
