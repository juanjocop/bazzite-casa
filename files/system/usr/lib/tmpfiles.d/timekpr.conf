# Control parental Fase 5b (issue #23) — directorios de estado de timekpr-next.
#
# timekpr-next crea /var/lib/timekpr/{config,work} vía %dir del RPM. En ostree/
# atomic (Bazzite) /var NO forma parte del commit ostree, asi que esos %dir NO se
# materializan en runtime. Sin /var/lib/timekpr/work el daemon crashea en bucle al
# guardar el fichero de control de tiempo (FileNotFoundError) y NO rastrea ni
# bloquea a ningun usuario -> el control parental de tiempo queda inservible.
#
# systemd-tmpfiles crea estos directorios en cada arranque (sobrevive a resets de
# /var y aplica a toda la flota pc-*).
d /var/lib/timekpr        0755 root root -
d /var/lib/timekpr/config 0755 root root -
d /var/lib/timekpr/work   0755 root root -
